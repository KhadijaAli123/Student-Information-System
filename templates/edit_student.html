{% extends "base.html" %}

{% block title %}Edit Student - Student Information System{% endblock %}

{% block content %}
<h1>Edit Student</h1>

<div style="background: white; padding: 2rem; border-radius: 8px; max-width: 600px; margin-top: 2rem;">
    <form method="POST" action="{{ url_for('main.edit_student', student_id=student.id) }}">
        <div style="margin-bottom: 1.5rem;">
            <label for="roll_number">Roll Number <span style="color: red;">*</span></label><br>
            <input type="text" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="name">Full Name <span style="color: red;">*</span></label><br>
            <input type="text" id="name" name="name" value="{{ student.name }}" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="email">Email <span style="color: red;">*</span></label><br>
            <input type="email" id="email" name="email" value="{{ student.email }}" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="phone">Phone</label><br>
            <input type="tel" id="phone" name="phone" value="{{ student.phone or '' }}" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="date_of_birth">Date of Birth</label><br>
            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ student.date_of_birth.strftime('%Y-%m-%d') if student.date_of_birth else '' }}" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="address">Address</label><br>
            <textarea id="address" name="address" rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">{{ student.address or '' }}</textarea>
        </div>

        <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-success">Update Student</button>
            <a href="{{ url_for('main.list_students') }}" class="btn" style="background-color: #95a5a6;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
