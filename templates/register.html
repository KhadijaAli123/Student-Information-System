{% extends 'base.html' %}

{% block title %}Register - Student Information System{% endblock %}

{% block content %}
    <h1>Register</h1>
    <form action="{{ url_for('main.register') }}" method="post" style="max-width: 400px; margin-top: 1rem;">
        <div style="margin-bottom: 1rem;">
            <label for="email">Email</label><br>
            <input type="email" name="email" id="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="password">Password</label><br>
            <input type="password" name="password" id="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="confirm_password">Confirm Password</label><br>
            <input type="password" name="confirm_password" id="confirm_password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button class="btn btn-success" type="submit">Register</button>
    </form>
    <p style="margin-top: 1rem;">Already have an account? <a href="{{ url_for('main.login') }}">Login here</a>.</p>
{% endblock %}
